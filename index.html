<!DOCTYPE html>
<html lang="ru" data-season="autumn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111126" id="themeColor">
<title>Молодёжка — Grace Youth SPb</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@500;600;700;800&family=Neucha&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme: dark;
  --white: #fffdf6;
  --ink: #111126;
  --safe: 4.5vmin;
  --ui: clamp(.8rem, 1.05vmin, 1.2rem);
  --transition: 500ms;

  /* ===== Сезон по умолчанию: осень ===== */
  --yellow: #ffc72c;
  --timer-shadow: #5a3b11;
  --stars: 1;
  --trunk: #100f20;
  --tree-back: #763b32;
  --leaf-a: #b9502f;
  --leaf-b: #e58b38;
  --leaf-c: #f1b348;
  --leaf-d: #793a39;
  --bg:
    radial-gradient(ellipse at 50% 53%, #383057 0%, transparent 48%),
    radial-gradient(ellipse at 12% 80%, #492d35 0%, transparent 44%),
    radial-gradient(ellipse at 88% 18%, #25264c 0%, transparent 42%),
    linear-gradient(145deg, #111126 0%, #1c1b3b 44%, #171326 100%);
}

/* ===== Зима ===== */
:root[data-season="winter"] {
  --yellow: #a9dcff;
  --timer-shadow: #1b3b5e;
  --stars: 1;
  --trunk: #0b1222;
  --tree-back: #35507a;
  --leaf-a: #e8f4ff;
  --leaf-b: #bcdcf5;
  --leaf-c: #ffffff;
  --leaf-d: #8fb8de;
  --bg:
    radial-gradient(ellipse at 50% 53%, #3a5f8f 0%, transparent 50%),
    radial-gradient(ellipse at 15% 85%, #2b4a7a 0%, transparent 45%),
    radial-gradient(ellipse at 88% 15%, #1f3a66 0%, transparent 42%),
    linear-gradient(160deg, #0e1a33 0%, #1d3557 50%, #14233f 100%);
}

/* ===== Лето ===== */
:root[data-season="summer"] {
  --yellow: #ffe066;
  --timer-shadow: #0d4a63;
  --stars: 0;
  --trunk: #1d2b1c;
  --tree-back: #1f5a3a;
  --leaf-a: #2e8b57;
  --leaf-b: #4caf50;
  --leaf-c: #8bc34a;
  --leaf-d: #1b6b3a;
  --bg:
    radial-gradient(circle at 85% 12%, #ffe58a 0%, #ffd04a55 10%, transparent 34%),
    radial-gradient(ellipse at 50% 105%, #2f8f5b 0%, transparent 55%),
    linear-gradient(170deg, #1565a0 0%, #2a8fb5 55%, #23846a 100%);
}

/* ===== Весна ===== */
:root[data-season="spring"] {
  --yellow: #ffd1e3;
  --timer-shadow: #5a2a45;
  --stars: 0;
  --trunk: #2a1f26;
  --tree-back: #5a4a58;
  --leaf-a: #f4a6c0;
  --leaf-b: #ffd1dc;
  --leaf-c: #fff0f5;
  --leaf-d: #c9e6a1;
  --bg:
    radial-gradient(ellipse at 50% 50%, #5e8f6e 0%, transparent 52%),
    radial-gradient(ellipse at 10% 85%, #8a5a86 0%, transparent 45%),
    radial-gradient(ellipse at 90% 15%, #7aa07c 0%, transparent 42%),
    linear-gradient(150deg, #2f5a4a 0%, #4d7a63 50%, #6b5a85 100%);
}

/* ===== Рождество ===== */
:root[data-season="christmas"] {
  --yellow: #ffd24a;
  --timer-shadow: #5a1020;
  --stars: 1;
  --trunk: #0a0f0c;
  --tree-back: #1b5a3a;
  --leaf-a: #d63a3a;
  --leaf-b: #1f8a52;
  --leaf-c: #f4c542;
  --leaf-d: #0f5a37;
  --bg:
    radial-gradient(ellipse at 50% 53%, #3c1f2f 0%, transparent 50%),
    radial-gradient(ellipse at 12% 85%, #0f4a32 0%, transparent 46%),
    radial-gradient(ellipse at 88% 15%, #5a1424 0%, transparent 44%),
    linear-gradient(145deg, #0b1a14 0%, #14301f 45%, #2a0f18 100%);
}

/* ===== Пасха ===== */
:root[data-season="easter"] {
  --yellow: #ffe58a;
  --timer-shadow: #3d2a6a;
  --stars: 0;
  --trunk: #2a2140;
  --tree-back: #7a5fa8;
  --leaf-a: #ffc8dd;
  --leaf-b: #bde0fe;
  --leaf-c: #fff1a8;
  --leaf-d: #b8f2c9;
  --bg:
    radial-gradient(ellipse at 50% 50%, #8b6fc0 0%, transparent 52%),
    radial-gradient(ellipse at 10% 85%, #b0558f 0%, transparent 45%),
    radial-gradient(ellipse at 90% 15%, #6f7fd0 0%, transparent 42%),
    linear-gradient(150deg, #4b3f8a 0%, #6a52a5 50%, #8f4f95 100%);
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
}

body {
  overflow: hidden;
  background: var(--ink);
  color: var(--white);
  font-family: Montserrat, Arial, sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

button, input, select { font: inherit; }

button {
  border: 1px solid #ffffff30;
  border-radius: 999px;
  padding: .72em 1.05em;
  color: var(--white);
  background: #ffffff12;
  cursor: pointer;
  transition: background 180ms, border-color 180ms, opacity 180ms;
}

button:hover, button:focus-visible {
  background: #ffffff25;
  border-color: var(--yellow);
  outline: none;
}

button:active { opacity: .7; }

button.primary {
  color: #181321;
  background: var(--yellow);
  border-color: var(--yellow);
  font-weight: 800;
}

button.primary:hover { background: color-mix(in srgb, var(--yellow) 85%, white); }

input, select {
  min-width: 0;
  padding: .7em .85em;
  border: 1px solid #ffffff35;
  border-radius: .65em;
  color: white;
  background: #17162b;
}

input:focus-visible, select:focus-visible {
  outline: 2px solid var(--yellow);
  outline-offset: 2px;
}

.stage {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto;
  width: 100%;
  height: 100%;
  min-height: 0;
  padding: var(--safe);
  isolation: isolate;
  background: var(--bg);
}

.stage::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  opacity: .12;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
  background-size: 11rem 11rem;
}

.stage::after {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 14vmin #05040d55;
}

.topbar, .footer {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.topbar {
  min-height: 5vh;
  font-size: clamp(1rem, 2.3vmin, 2.5rem);
  font-weight: 800;
  letter-spacing: -.035em;
}

.schedule {
  display: flex;
  align-items: center;
  gap: .55em;
  white-space: nowrap;
}

.schedule .day { color: var(--yellow); }
.schedule .divider {
  width: .09em;
  height: 1.05em;
  background: var(--yellow);
}
.schedule .time { color: var(--white); }

.brand {
  position: absolute;
  top: 12%;
  left: 50%;
  width: min(55vw, 75vh);
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

.brand-name {
  display: inline-block;
  color: var(--yellow);
  font-family: "Marck Script", cursive;
  font-size: clamp(2.8rem, 7.5vmin, 8rem);
  font-weight: 700;
  line-height: 1.05;
  text-shadow: 0 .04em 0 #1c1420;
}

.brand-swish {
  display: block;
  width: 76%;
  height: auto;
  margin: -.15em auto 0;
  overflow: visible;
}

.brand-swish path {
  fill: none;
  stroke: var(--white);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.center {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding-top: 9vh;
  padding-bottom: 4vh;
  text-align: center;
}

.label {
  max-width: 88%;
  margin: 0 0 1.3vh;
  color: var(--white);
  font-size: clamp(1.15rem, 2.5vmin, 3rem);
  font-weight: 700;
  letter-spacing: .035em;
  text-wrap: balance;
  text-shadow: 0 .08em .3em #09081480;
}

.timer-shell {
  position: relative;
  display: grid;
  place-items: center;
  width: min(88vw, 145vh);
  min-height: 0;
  flex: 0 1 auto;
  aspect-ratio: 2.35 / 1;
  max-height: 57vh;
}

.bubble {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  filter: drop-shadow(0 .4vmin .7vmin #05040c25);
}

.bubble path {
  fill: #fffdf60b;
  stroke: var(--white);
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.timer {
  position: relative;
  z-index: 1;
  max-width: 91%;
  color: var(--yellow);
  font-family: Neucha, "Marck Script", cursive;
  font-size: clamp(5rem, 20vmin, 28rem);
  font-weight: 700;
  line-height: .98;
  letter-spacing: -.035em;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  text-shadow:
    0 .035em 0 var(--timer-shadow),
    0 .07em .12em #00000038;
  transform: translateY(-.015em);
}

.timer.long { font-size: clamp(4rem, 14vmin, 20rem); }

.timer.pulse { animation: pulse 1s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.025); opacity: .83; }
}

.stage.finished::before {
  animation: flash 750ms ease-out 1;
}

@keyframes flash {
  0% { background-color: color-mix(in srgb, var(--yellow) 50%, transparent); opacity: .7; }
  100% { background-color: transparent; opacity: .12; }
}

/* Деревья — векторные силуэты, цвета задаются сезоном */
.landscape {
  position: absolute;
  z-index: -1;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.landscape svg {
  position: absolute;
  bottom: -1%;
  width: 36%;
  height: 80%;
  overflow: visible;
}

.landscape .left { left: -4%; }
.landscape .right { right: -4%; transform: scaleX(-1); }

.tree-trunk { fill: var(--trunk); opacity: .78; transition: fill var(--transition); }
.tree-back { fill: var(--tree-back); opacity: .55; transition: fill var(--transition); }
.tree-leaf-a { fill: var(--leaf-a); opacity: .7; transition: fill var(--transition); }
.tree-leaf-b { fill: var(--leaf-b); opacity: .65; transition: fill var(--transition); }
.tree-leaf-c { fill: var(--leaf-c); opacity: .7; transition: fill var(--transition); }
.tree-leaf-d { fill: var(--leaf-d); opacity: .8; transition: fill var(--transition); }

.leaf-drift { animation: drift 13s ease-in-out infinite alternate; }
.leaf-drift.slow { animation-duration: 19s; animation-delay: -5s; }

@keyframes drift {
  from { transform: translate3d(-.5%, 0, 0) rotate(-1deg); }
  to { transform: translate3d(1.5%, -1%, 0) rotate(2deg); }
}

.stars {
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  opacity: var(--stars);
  transition: opacity var(--transition);
}

.star {
  position: absolute;
  width: .24vmin;
  height: .24vmin;
  min-width: 2px;
  min-height: 2px;
  border-radius: 50%;
  background: #fff8dc;
  box-shadow: 0 0 1.1vmin #fff8dc;
  animation: twinkle 4s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.7); }
  to { opacity: .9; transform: scale(1.3); }
}

.shooting-star {
  position: absolute;
  top: 17%;
  left: -20%;
  width: 13vmin;
  height: .18vmin;
  min-height: 2px;
  border-radius: 100%;
  opacity: 0;
  transform: rotate(-25deg);
  background: linear-gradient(90deg, transparent, #ffffffd9);
  filter: drop-shadow(0 0 .6vmin #fff);
  animation: shoot 14s ease-in infinite;
  animation-delay: 5s;
}

@keyframes shoot {
  0%, 78%, 100% { opacity: 0; transform: translate(0, 0) rotate(-25deg); }
  80% { opacity: .95; }
  88% { opacity: 0; transform: translate(130vw, 45vh) rotate(-25deg); }
}

/* Сезонные частицы: снег, листья, лепестки, светлячки, яйца */
.fall {
  position: absolute;
  z-index: -1;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.p {
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  will-change: transform;
  animation: fall linear infinite;
}

.p.snow { border-radius: 50%; box-shadow: 0 0 .6vmin #ffffff80; }
.p.leaf { border-radius: 0 100% 0 100%; }
.p.petal { border-radius: 100% 0 100% 0; }
.p.egg {
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  background-image: linear-gradient(transparent 38%, #ffffffa0 38% 54%, transparent 54%);
}
.p.glow {
  border-radius: 50%;
  box-shadow: 0 0 1.2vmin .3vmin currentColor;
  animation-name: rise;
}

@keyframes fall {
  0%   { transform: translate3d(0, -10vh, 0) rotate(0); opacity: 0; }
  10%  { opacity: var(--op, .9); }
  90%  { opacity: var(--op, .9); }
  100% { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); opacity: 0; }
}

@keyframes rise {
  0%   { transform: translate3d(0, 105vh, 0) scale(.6); opacity: 0; }
  15%  { opacity: var(--op, .85); }
  85%  { opacity: var(--op, .85); }
  100% { transform: translate3d(var(--dx), -10vh, 0) scale(1.1); opacity: 0; }
}

.footer {
  min-height: 5vh;
  align-items: flex-end;
  font-size: clamp(.9rem, 1.8vmin, 2rem);
  font-weight: 700;
}

.status {
  color: #ffffffb8;
  font-size: .78em;
  letter-spacing: .09em;
  text-transform: uppercase;
}

.telegram {
  display: flex;
  align-items: center;
  gap: .65em;
  color: var(--white);
  text-decoration: none;
  white-space: nowrap;
}

.telegram svg {
  width: 1.8em;
  height: 1.8em;
  flex: 0 0 auto;
  fill: var(--yellow);
}

.telegram:hover { color: var(--yellow); }

/* Невидимая зона у нижнего края: наведение возвращает панель */
.controls-zone {
  position: fixed;
  z-index: 19;
  right: 0;
  bottom: 0;
  left: 0;
  height: 14vh;
}

.controls {
  position: fixed;
  z-index: 20;
  right: 2vw;
  bottom: 2vh;
  left: 2vw;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: .65rem;
  padding: .85rem;
  border: 1px solid #ffffff25;
  border-radius: 1rem;
  background: #100f20ed;
  box-shadow: 0 1rem 4rem #0006;
  color: white;
  font-size: var(--ui);
  opacity: 1;
  transform: translateY(0);
  transition: opacity 250ms, transform 250ms;
}

.controls .group {
  display: flex;
  align-items: center;
  gap: .4rem;
}

.controls .separator {
  width: 1px;
  align-self: stretch;
  background: #ffffff28;
  margin: 0 .2rem;
}

.controls input[type="number"] { width: 5.5em; }
.controls input[type="text"] { width: 13em; }
.controls button { white-space: nowrap; }

body.controls-hidden .controls {
  opacity: 0;
  transform: translateY(1.5rem);
  pointer-events: none;
}

body.controls-hidden,
body.controls-hidden * { cursor: none !important; }

/* Над зоной наведения курсор остаётся видимым */
body.controls-hidden .controls-zone { cursor: default !important; }

@media (max-aspect-ratio: 5/4) {
  :root { --safe: 5vw; }

  .stage { grid-template-rows: auto 1fr auto; }
  .topbar { font-size: clamp(1rem, 4vw, 2rem); }
  .brand {
    top: 14%;
    width: 88vw;
  }
  .brand-name { font-size: clamp(3rem, 13vw, 7rem); }
  .center {
    padding-top: 14vh;
    padding-bottom: 5vh;
  }
  .label { font-size: clamp(1.1rem, 4vw, 2rem); }
  .timer-shell {
    width: 90vw;
    aspect-ratio: 1.45 / 1;
    max-height: 43vh;
  }
  .timer { font-size: clamp(4rem, 21vw, 12rem); }
  .timer.long { font-size: clamp(3rem, 14vw, 8rem); }
  .landscape svg { width: 55%; height: 58%; }
  .footer { font-size: clamp(.85rem, 2.5vw, 1.4rem); }
  .status { display: none; }
  .controls { max-height: 48vh; overflow-y: auto; }
}

@media (max-height: 38rem) and (min-aspect-ratio: 5/4) {
  :root { --safe: 3vh; }
  .brand { top: 8%; }
  .brand-name { font-size: 6vmin; }
  .center { padding-top: 7vh; padding-bottom: 2vh; }
  .label { margin-bottom: .5vh; font-size: 2.3vmin; }
  .timer-shell { max-height: 53vh; }
  .timer { font-size: 18vmin; }
  .footer { font-size: 1.7vmin; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

        </g>
      </g>
    </svg>

    <svg class="right" viewBox="0 0 500 800" preserveAspectRatio="xMidYMax meet">
      <g class="leaf-drift slow">
        <path class="tree-back" d="M0 800 L0 320 Q55 280 60 200 Q90 260 110 300 Q130 190 185 140 Q170 250 205 320 Q260 240 300 225 Q270 320 300 385 L340 800Z"/>
        <path class="tree-trunk" d="M35 800 Q90 600 92 410 Q72 330 48 270 Q92 315 110 355 Q108 240 160 160 Q135 295 150 390 Q180 310 220 285 Q185 365 160 435 Q190 590 250 800Z"/>
        <g class="leaf-drift">
          <ellipse class="tree-leaf-a" cx="82" cy="300" rx="47" ry="22" transform="rotate(35 82 300)"/>
          <ellipse class="tree-leaf-b" cx="122" cy="236" rx="52" ry="24" transform="rotate(-48 122 236)"/>
          <ellipse class="tree-leaf-c" cx="177" cy="294" rx="45" ry="22" transform="rotate(18 177 294)"/>
          <ellipse class="tree-leaf-d" cx="210" cy="342" rx="47" ry="25" transform="rotate(-35 210 342)"/>
          <ellipse class="tree-leaf-b" cx="55" cy="376" rx="49" ry="22" transform="rotate(-35 55 376)"/>
          <ellipse class="tree-leaf-c" cx="143" cy="185" rx="34" ry="20" transform="rotate(-20 143 185)"/>
          <ellipse class="tree-leaf-a" cx="260" cy="282" rx="38" ry="20" transform="rotate(38 260 282)"/>
          <ellipse class="tree-leaf-d" cx="76" cy="447" rx="45" ry="23" transform="rotate(22 76 447)"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="fall" id="fall" aria-hidden="true"></div>

  <header class="topbar">
    <div class="schedule" aria-label="Суббота, 17:30">
      <span class="day">СБ</span>
      <span class="divider"></span>
      <span class="time">17:30</span>
    </div>
    <div id="clock" aria-label="Текущее время">--:--</div>
  </header>

  <div class="brand" aria-label="Молодёжка">
    <div class="brand-name">Молодёжка</div>
    <svg class="brand-swish" viewBox="0 0 500 35" aria-hidden="true">
      <path d="M20 21 C105 33 166 5 255 15 S389 32 477 7"/>
      <path d="M390 19 Q438 13 474 7 Q455 18 449 25"/>
    </svg>
  </div>

  <section class="center">
    <div class="label" id="message">Начало через…</div>

    <div class="timer-shell">
      <svg class="bubble" viewBox="0 0 1000 420" preserveAspectRatio="none" aria-hidden="true">
        <path d="M130 73
          C195 52 286 62 370 48
          C493 29 575 49 681 45
          C795 39 886 45 911 96
          C929 135 911 165 924 203
          C939 246 913 290 873 319
          C818 359 736 350 655 361
          C541 377 450 354 351 370
          C259 385 174 368 121 340
          C76 316 73 279 83 235
          C94 189 68 150 87 119
          C96 102 108 88 130 73 Z"/>
      </svg>
      <div class="timer" id="timer" role="timer" aria-live="off">10:00</div>
    </div>
  </section>

  <footer class="footer">
    <div class="status" id="status">Grace Youth SPb · вместе лучше</div>
    <a class="telegram" href="https://t.me/grace_youth_spb" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.8 3.4 18.5 20c-.25 1.17-.92 1.46-1.87.91l-5.17-3.81-2.5 2.4c-.28.28-.52.52-1.06.52l.37-5.27 9.6-8.67c.42-.37-.1-.58-.65-.21L5.35 13.3.24 11.7c-1.1-.34-1.12-1.1.23-1.63L20.45 2.4c.91-.33 1.71.22 1.35 1z"/>
      </svg>
      <span>t.me/grace_youth_spb</span>
    </a>
  </footer>
</main>

<div class="controls-zone" id="controlsZone" aria-hidden="true"></div>

<section class="controls" id="controls" aria-label="Управление таймером">
  <div class="group">
    <button class="primary" id="startBtn">▶ Старт</button>
    <button id="resetBtn">↺ Сброс</button>
    <button id="minusBtn">−1 мин</button>
    <button id="plusBtn">+1 мин</button>
  </div>

  <span class="separator"></span>

  <div class="group" aria-label="Быстрые пресеты">
    <button data-minutes="5">5 мин</button>
    <button data-minutes="10">10 мин</button>
    <button data-minutes="15">15 мин</button>
    <button data-minutes="30">30 мин</button>
  </div>

  <div class="group">
    <label for="minutes">Мин.</label>
    <input id="minutes" type="number" min="0" max="999" value="10" aria-label="Минуты">
    <label for="seconds">Сек.</label>
    <input id="seconds" type="number" min="0" max="59" value="0" aria-label="Секунды">
    <button id="applyBtn">Установить</button>
  </div>

  <span class="separator"></span>

  <div class="group">
    <label for="mode">Режим</label>
    <select id="mode">
      <option value="countdown">Обратный отсчёт</option>
      <option value="stopwatch">Секундомер</option>
      <option value="deadline">До субботы 17:30</option>
    </select>
  </div>

  <div class="group">
    <label for="season">Сезон</label>
    <select id="season">
      <option value="autumn">🍂 Осень</option>
      <option value="winter">❄ Зима</option>
      <option value="spring">🌸 Весна</option>
      <option value="summer">☀ Лето</option>
      <option value="christmas">🎄 Рождество</option>
      <option value="easter">🥚 Пасха</option>
    </select>
  </div>

  <div class="group">
    <input id="messageInput" type="text" value="Начало через…" maxlength="70" aria-label="Заголовок таймера">
    <button id="messageBtn">Заголовок</button>
  </div>

  <div class="group">
    <button id="soundBtn" aria-pressed="true">♫ Звук: вкл.</button>
    <button id="fullscreenBtn">⛶ Экран</button>
  </div>
</section>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const stage = $("stage");
  const timerEl = $("timer");
  const messageEl = $("message");
  const statusEl = $("status");
  const controls = $("controls");
  const zone = $("controlsZone");

  const state = {
    mode: "countdown",
    duration: 10 * 60_000,
    remaining: 10 * 60_000,
    running: false,
    startedAt: 0,
    startValue: 0,
    deadline: 0,
    sound: true,
    finished: false,
    wakeLock: null,
    audio: null
  };

  const ui = { hover: false, hideTimer: null };

  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= Сезоны ================= */

  const SEASONS = {
    autumn: {
      themeColor: "#111126",
      kind: "leaf", count: 26, size: [1.2, 2.2], duration: [11, 20], drift: 12,
      colors: ["#e58b38", "#b9502f", "#f1b348", "#c4442e"]
    },
    winter: {
      themeColor: "#0e1a33",
      kind: "snow", count: 80, size: [.35, .9], duration: [9, 18], drift: 6,
      colors: ["#ffffff", "#e6f4ff", "#cfe9ff"]
    },
    spring: {
      themeColor: "#2f5a4a",
      kind: "petal", count: 34, size: [1, 1.7], duration: [10, 18], drift: 12,
      colors: ["#ffc2d6", "#ffe0ea", "#ffffff", "#f7a8c4"]
    },
    summer: {
      themeColor: "#1565a0",
      kind: "glow", count: 36, size: [.35, .8], duration: [9, 18], drift: 8, opacity: .85,
      colors: ["#fff2a0", "#ffe066", "#d9ff8a"]
    },
    christmas: {
      themeColor: "#0b1a14",
      kind: "snow", count: 60, size: [.35, .9], duration: [9, 18], drift: 6,
      colors: ["#ffffff", "#ffffff", "#e6f4ff", "#ffd76a"]
    },
    easter: {
      themeColor: "#4b3f8a",
      kind: "egg", count: 24, size: [1.3, 2], duration: [14, 24], drift: 8,
      colors: ["#ffc8dd", "#bde0fe", "#fff1a8", "#cdb4f6", "#b8f2c9"]
    }
  };

  const fallEl = $("fall");
  const rand = (min, max) => min + Math.random() * (max - min);

  function buildParticles(name) {
    fallEl.replaceChildren();
    if (reducedMotion) return;

    const cfg = SEASONS[name];
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < cfg.count; i++) {
      const el = document.createElement("span");
      const color = cfg.colors[Math.floor(Math.random() * cfg.colors.length)];
      const size = rand(cfg.size[0], cfg.size[1]);

      el.className = `p ${cfg.kind}`;
      el.style.left = `${rand(0, 100)}%`;
      el.style.width = `${size}vmin`;
      el.style.height = `${cfg.kind === "egg" ? size * 1.3 : size}vmin`;
      el.style.backgroundColor = color;
      el.style.color = color;
      el.style.animationDuration = `${rand(cfg.duration[0], cfg.duration[1])}s`;
      el.style.animationDelay = `${-rand(0, cfg.duration[1])}s`;
      el.style.setProperty("--dx", `${rand(-cfg.drift, cfg.drift)}vw`);
      el.style.setProperty("--rot", `${rand(-360, 360)}deg`);
      el.style.setProperty("--op", String(cfg.opacity ?? rand(.55, .95)));
      fragment.appendChild(el);
    }

    fallEl.appendChild(fragment);
  }

  function setSeason(name, save = true) {
    if (!SEASONS[name]) name = "autumn";

    document.documentElement.dataset.season = name;
    $("season").value = name;
    $("themeColor").content = SEASONS[name].themeColor;
    buildParticles(name);

    if (save) {
      try { localStorage.setItem("molodezhka-season", name); } catch (_) {}
    }
  }

  /* ================= Таймер ================= */

  function formatTime(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const seconds = total % 60;
    const pad = n => String(n).padStart(2, "0");

    if (hours > 0) return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    return `${pad(Math.floor(total / 60))}:${pad(seconds)}`;
  }

  function nextSaturdayDeadline() {
    const now = new Date();
    const result = new Date(now);
    const daysUntilSaturday = (6 - now.getDay() + 7) % 7;

    result.setDate(now.getDate() + daysUntilSaturday);
    result.setHours(17, 30, 0, 0);

    if (result.getTime() <= now.getTime()) {
      result.setDate(result.getDate() + 7);
    }

    return result.getTime();
  }

  function currentValue() {
    if (!state.running) return state.remaining;

    const elapsed = Date.now() - state.startedAt;

    if (state.mode === "stopwatch") return state.startValue + elapsed;
    if (state.mode === "deadline") return Math.max(0, state.deadline - Date.now());
    return Math.max(0, state.startValue - elapsed);
  }

  function render() {
    const value = currentValue();
    timerEl.textContent = formatTime(value);
    timerEl.classList.toggle(
      "long",
      value >= 3600_000 || timerEl.textContent.length >= 8
    );

    const urgent = state.mode !== "stopwatch" &&
      state.running && value > 0 && value <= 60_000;

    timerEl.classList.toggle("pulse", urgent && !reducedMotion);

    if (state.mode === "stopwatch") {
      statusEl.textContent = state.running ? "Секундомер · идёт" : "Секундомер";
    } else if (state.mode === "deadline") {
      statusEl.textContent = "До субботы, 17:30";
    } else {
      statusEl.textContent = state.running ? "Grace Youth SPb" : "Grace Youth SPb";
    }

    if (state.running && state.mode !== "stopwatch" && value <= 0) {
      finish();
    }

    syncControls();
  }

  function finish() {
    if (state.finished) return;

    state.finished = true;
    state.running = false;
    state.remaining = 0;
    timerEl.textContent = "00:00";
    timerEl.classList.remove("pulse");
    stage.classList.remove("finished");

    // Перезапуск CSS-анимации вспышки
    void stage.offsetWidth;
    stage.classList.add("finished");

    $("startBtn").textContent = "▶ Старт";
    statusEl.textContent = "Время!";

    if (state.sound) playChime();
  }

  function playChime() {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      if (!state.audio) state.audio = new AudioContextClass();
      const ctx = state.audio;

      if (ctx.state === "suspended") ctx.resume();

      [660, 880].forEach((frequency, index) => {
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        const start = ctx.currentTime + index * 0.22;

        oscillator.type = "sine";
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.12, start + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.48);

        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start(start);
        oscillator.stop(start + 0.5);
      });
    } catch (error) {
      console.warn("Звук недоступен:", error);
    }
  }

  function syncInputs() {
    const totalSeconds = Math.floor(state.remaining / 1000);
    $("minutes").value = Math.floor(totalSeconds / 60);
    $("seconds").value = totalSeconds % 60;
  }

  function pause() {
    if (!state.running) return;

    state.remaining = currentValue();
    state.running = false;
    $("startBtn").textContent = "▶ Старт";
    render();
  }

  function start() {
    if (state.running) {
      pause();
      return;
    }

    if (state.mode === "deadline") {
      state.deadline = nextSaturdayDeadline();
      state.remaining = state.deadline - Date.now();
    }

    if (state.mode === "countdown" && state.remaining <= 0) {
      state.remaining = state.duration;
    }

    state.startValue = state.remaining;
    state.finished = false;
    stage.classList.remove("finished");
    state.startedAt = Date.now();
    state.running = true;
    $("startBtn").textContent = "Ⅱ Пауза";
    render();
    requestWakeLock();
  }

  function reset() {
    state.running = false;
    state.finished = false;
    stage.classList.remove("finished");
    timerEl.classList.remove("pulse");

    if (state.mode === "deadline") {
      state.deadline = nextSaturdayDeadline();
      state.remaining = state.deadline - Date.now();
    } else {
      state.remaining = state.duration;
    }

    state.startValue = state.remaining;
    $("startBtn").textContent = "▶ Старт";
    syncInputs();
    render();
  }

  function setDuration(ms) {
    pause();
    state.mode = "countdown";
    $("mode").value = "countdown";
    state.duration = Math.max(0, ms);
    state.remaining = state.duration;
    state.startValue = state.remaining;
    state.finished = false;
    stage.classList.remove("finished");
    syncInputs();
    render();
  }

  function adjustTime(delta) {
    pause();

    if (state.mode === "deadline") {
      state.mode = "countdown";
      $("mode").value = "countdown";
    }

    const next = Math.max(0, state.remaining + delta);
    state.duration = next;
    state.remaining = next;
    state.startValue = next;
    state.finished = false;
    stage.classList.remove("finished");
    syncInputs();
    render();
  }

  function changeMode(mode) {
    pause();
    state.mode = mode;
    state.finished = false;
    stage.classList.remove("finished");

    if (mode === "deadline") {
      state.deadline = nextSaturdayDeadline();
      state.remaining = state.deadline - Date.now();
      messageEl.textContent = "Начало уже скоро";
    } else if (mode === "stopwatch") {
      state.duration = 0;
      state.remaining = 0;
      state.startValue = 0;
      messageEl.textContent = "Время вместе";
    } else {
      state.remaining = state.duration;
      state.startValue = state.duration;
      messageEl.textContent = "Начало через…";
    }

    syncInputs();
    render();
  }

  async function requestWakeLock() {
    if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;

    try {
      if (state.wakeLock) return;
      state.wakeLock = await navigator.wakeLock.request("screen");
      state.wakeLock.addEventListener("release", () => {
        state.wakeLock = null;
      });
    } catch (error) {
      console.info("Wake Lock недоступен:", error.message);
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") requestWakeLock();
  });

  /* ================= Панель управления ================= */

  // Панель скрыта, только пока таймер идёт, а курсор вне панели и нижней зоны.
  function keyboardFocus() {
    const active = document.activeElement;
    return !!active && controls.contains(active) && active.matches(":focus-visible");
  }

  function shouldHideControls() {
    return state.running && !ui.hover && !keyboardFocus();
  }

  function syncControls() {
    const body = document.body;
    const hidden = body.classList.contains("controls-hidden");

    if (!shouldHideControls()) {
      clearTimeout(ui.hideTimer);
      ui.hideTimer = null;
      if (hidden) body.classList.remove("controls-hidden");
      return;
    }

    if (hidden || ui.hideTimer) return;

    // Небольшая задержка, чтобы панель не мигала при переходе зона → панель
    ui.hideTimer = setTimeout(() => {
      ui.hideTimer = null;
      if (shouldHideControls()) body.classList.add("controls-hidden");
    }, 400);
  }

  function setHover(value) {
    ui.hover = value;
    syncControls();
  }

  [zone, controls].forEach(el => {
    el.addEventListener("mouseenter", () => setHover(true));
    el.addEventListener("mouseleave", () => setHover(false));
    el.addEventListener("touchstart", () => setHover(true), { passive: true });
  });

  // Тач: касание вне панели и зоны прячет панель
  document.addEventListener("touchstart", event => {
    if (!controls.contains(event.target) && !zone.contains(event.target)) {
      setHover(false);
    }
  }, { passive: true });

  document.documentElement.addEventListener("mouseleave", () => setHover(false));

  /* ================= Обработчики ================= */

  $("startBtn").addEventListener("click", start);
  $("resetBtn").addEventListener("click", reset);
  $("minusBtn").addEventListener("click", () => adjustTime(-60_000));
  $("plusBtn").addEventListener("click", () => adjustTime(60_000));

  document.querySelectorAll("[data-minutes]").forEach(button => {
    button.addEventListener("click", () => {
      setDuration(Number(button.dataset.minutes) * 60_000);
    });
  });

  $("applyBtn").addEventListener("click", () => {
    const minutes = Math.max(0, Number($("minutes").value) || 0);
    const seconds = Math.min(59, Math.max(0, Number($("seconds").value) || 0));
    setDuration((minutes * 60 + seconds) * 1000);
  });

  $("mode").addEventListener("change", event => changeMode(event.target.value));
  $("season").addEventListener("change", event => setSeason(event.target.value));

  $("messageBtn").addEventListener("click", () => {
    const value = $("messageInput").value.trim();
    if (value) messageEl.textContent = value;
  });

  $("messageInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();
      $("messageBtn").click();
    }
  });

  $("soundBtn").addEventListener("click", () => {
    state.sound = !state.sound;
    $("soundBtn").textContent = state.sound ? "♫ Звук: вкл." : "♫ Звук: выкл.";
    $("soundBtn").setAttribute("aria-pressed", String(state.sound));
  });

  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.warn("Полноэкранный режим недоступен:", error);
    }
  }

  $("fullscreenBtn").addEventListener("click", toggleFullscreen);

  document.addEventListener("fullscreenchange", () => {
    $("fullscreenBtn").textContent =
      document.fullscreenElement ? "⛶ Выйти" : "⛶ Экран";
  });

  document.addEventListener("keydown", event => {
    const target = event.target;
    const typing = target instanceof HTMLInputElement ||
      target instanceof HTMLTextAreaElement ||
      target instanceof HTMLSelectElement ||
      target.isContentEditable;

    if (typing) {
      if (event.key === "Escape") target.blur();
      return;
    }

    if (event.code === "Space") {
      event.preventDefault();
      start();
    } else if (event.key.toLowerCase() === "r") {
      reset();
    } else if (event.key.toLowerCase() === "f") {
      toggleFullscreen();
    } else if (event.key === "Escape" && document.fullscreenElement) {
      document.exitFullscreen();
    }
  });

  /* ================= Звёзды (генерируются один раз) ================= */

  const stars = $("stars");
  let seed = 271828;
  function random() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
  }

  for (let i = 0; i < 64; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.style.left = `${random() * 100}%`;
    star.style.top = `${random() * 100}%`;
    star.style.opacity = String(0.2 + random() * 0.65);
    star.style.animationDelay = `${random() * 5}s`;
    star.style.animationDuration = `${3 + random() * 4}s`;
    if (i % 5 === 0) {
      star.style.width = "0.4vmin";
      star.style.height = "0.4vmin";
    }
    stars.appendChild(star);
  }

  function updateClock() {
    const now = new Date();
    $("clock").textContent = now.toLocaleTimeString("ru-RU", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });
  }

  // Date.now() — источник истины, поэтому фоновые вкладки не сбивают отсчёт
  function tick() {
    updateClock();
    render();
  }

  let savedSeason = "autumn";
  try { savedSeason = localStorage.getItem("molodezhka-season") || "autumn"; } catch (_) {}
  setSeason(savedSeason, false);

  state.deadline = nextSaturdayDeadline();
  syncInputs();
  updateClock();
  render();
  setInterval(tick, 100);
})();
</script>
</body>
